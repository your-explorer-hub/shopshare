name: shopping_app
description: Shared shopping list app with categories, family sharing, and timeline view.
publish_to: 'none'
version: 1.0.5+20

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase & Authentication - Phase 4 & 5 updates
  firebase_core: ^3.15.2             # Phase 4: Updated from 3.8.0
  firebase_auth: ^5.7.0              # Phase 4: Updated from 5.4.0
  cloud_firestore: ^5.6.12           # Phase 4: Updated from 5.5.0
  google_sign_in: ^6.3.0             # Phase 5: Updated from 6.2.1
  firebase_analytics: ^11.6.0        # Phase 4: Updated from 11.3.3

  # Local Database (SQLite) - Phase 1 updates
  sqflite: ^2.4.2+1              # Updated from 2.3.2
  sqflite_common_ffi_web: ^1.1.1
  path: ^1.9.0

  # State Management
  provider: ^6.1.2

  # UI & Design - Phase 1 & 2 updates
  google_fonts: ^8.1.0           # Phase 2: Updated from 6.2.1 (MAJOR)
  flutter_animate: ^4.5.0
  cached_network_image: ^3.4.1  # Phase 1: Updated from 3.3.1
  shimmer: ^3.0.0

  # Navigation - Phase 7 update
  go_router: ^13.2.5             # Phase 7: Updated from 13.2.0

  # Voice input - Phase 1 update
  speech_to_text: ^7.4.0        # Updated from 7.0.0

  # Utilities - Phase 1 & 3 updates
  intl: ^0.20.2                 # Phase 3: Updated from 0.19.0
  uuid: ^4.4.0
  url_launcher: ^6.2.6
  share_plus: ^13.1.0           # Phase 1: Updated from 13.0.0
  shared_preferences: ^2.2.3
  flutter_local_notifications: ^18.0.1  # Phase 6: Updated from 18.0.0
  in_app_review: ^2.0.9
  app_links: ^7.0.0             # Phase 3: Updated from 6.3.2 (7.1.1 requires Dart 3.12+)

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_launcher_icons: ^0.14.3
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0          # Phase 2: Updated from 3.0.1 (MAJOR)
  mockito: ^5.6.4                # Keep at 5.6.4 (5.7.0 conflicts with Flutter SDK)
  build_runner: ^2.15.0          # Phase 1: Updated from 2.4.9

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/adi-registration.properties
    - assets/web_allowlist.txt

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/icons/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#6750A4"
  adaptive_icon_foreground: "assets/icons/app_icon_foreground.png"
  web:
    generate: true
    image_path: "assets/icons/app_icon.png"
    background_color: "#6750A4"
    theme_color: "#6750A4"