<!DOCTYPE html>
<html>
  <head>
    <!-- Allow microphone access for Web Speech API -->
    <meta http-equiv="Permissions-Policy" content="microphone=*">
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder web entry point for the ShopShare Flutter web app.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="ShopShare — shared family shopping lists, in real time.">
  <meta name="theme-color" content="#6200EE">

  <!--
    Google Sign-In web client ID.
    Replace CLIENT_ID below with your OAuth 2.0 Web Client ID from:
      Firebase Console → Project Settings → Your apps → Web app
      OR Google Cloud Console → APIs & Services → Credentials → Web client
    Format: NUMBERS-xxxx.apps.googleusercontent.com
  -->
  <meta name="google-signin-client_id" content="520607022589-uucpk0d107j7lg2dpu0injmckvnmj540.apps.googleusercontent.com">

  <!-- Open Graph -->
  <meta property="og:title" content="ShopShare">
  <meta property="og:description" content="Shared family shopping lists, in real time.">
  <meta property="og:type" content="website">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="ShopShare">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>ShopShare</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* Loading spinner shown before Flutter renders */
    body {
      margin: 0;
      background: linear-gradient(135deg, #6200EE 0%, #9C27B0 55%, #009688 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    #loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
    }

    #loading .logo {
      width: 80px;
      height: 80px;
      background: white;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.2);
    }

    #loading h1 {
      color: white;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 28px;
      font-weight: 800;
      margin: 0;
      letter-spacing: 1px;
    }

    .spinner {
      width: 28px;
      height: 28px;
      border: 2.5px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="loading">
    <div class="logo">🛒</div>
    <h1>ShopShare</h1>
    <div class="spinner"></div>
  </div>

  <!-- Firebase SDK (loaded before Flutter for initialisation) -->
  <script type="module">
    // Firebase is initialised via flutter firebase_core package.
    // No manual SDK loading needed when using FlutterFire.
  </script>

  <script>
    // Unregister stale service workers so the browser always fetches fresh files.
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(regs => {
        regs.forEach(r => r.unregister());
      });
    }

    // Hide the splash screen as soon as Flutter renders its first frame.
    // flutter_bootstrap.js calls _flutter.loader.load() itself, so we must NOT
    // call it again here — instead we watch the DOM for Flutter's root element.
    function _hideSplash() {
      var el = document.getElementById('loading');
      if (el) el.style.display = 'none';
    }
    var _splashObserver = new MutationObserver(function() {
      if (document.querySelector('flt-glass-pane') ||
          document.querySelector('flutter-view')) {
        _hideSplash();
        _splashObserver.disconnect();
      }
    });
    document.addEventListener('DOMContentLoaded', function() {
      _splashObserver.observe(document.body, { childList: true, subtree: true });
      // Safety fallback: hide after 12 s if Flutter never renders.
      setTimeout(_hideSplash, 12000);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
